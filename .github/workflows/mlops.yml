name: MLOps CI/CD Pipeline

# Пайплайн запускается автоматически при каждом пуше в ветку main
on:
  push:
    branches: [ "main" ]

jobs:
  # ЭТАП 1: Тестирование кода
  test:
    runs-on: ubuntu-latest # Выделяется чистый сервер на Linux
    steps:
    - name: Проверка кода из Git
      uses: actions/checkout@v4

    - name: Настройка Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Установка зависимостей
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest # библиотека для тестов

    - name: Запуск тестов API и Модели
      run: |
        pytest src/ # автоматический запуск всех тестов в проекте

  # ЭТАП 2: Сборка и отправка Docker-образа
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Проверка кода из Git
      uses: actions/checkout@v4

    # --- НОВЫЕ ШАГИ: Обучаем модель прямо на сервере GitHub ---
    - name: Настройка Python для обучения
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Установка зависимостей, генерация данных и обучение
      run: |
        pip install -r requirements.txt
        python src/generate_data.py
        python src/train_model.py
    # -----------------------------------------------------------

    - name: Авторизация в Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Сборка и пуш Docker-образа
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: lawandia/my_ml_pipeline:latest
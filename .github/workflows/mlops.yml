name: MLOps CI/CD Pipeline

# Пайплайн запускается автоматически при каждом пуше в ветку main
on:
  push:
    branches: [ "main" ]

jobs:
  # ЭТАП 1: Тестирование кода
  test:
    runs-on: ubuntu-latest # Выделяется чистый сервер на Linux
    steps:
    - name: Проверка кода из Git
      uses: actions/checkout@v3

    - name: Настройка Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Установка зависимостей
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest # библиотека для тестов

    - name: Запуск тестов API и Модели
      run: |
        pytest src/ # автоматический запуск всех тестов в проекте

  # ЭТАП 2: Сборка и отправка Docker-образа (запустится только если тесты прошли)
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Проверка кода из Git
      uses: actions/checkout@v3

    - name: Авторизация в Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }} # Переменные скрыты в настройках GitHub
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Сборка и пуш Docker-образа
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: your-docker-username/my_ml_pipeline:latest